<!doctype html>
<meta charset="utf-8">
<!--
  超簡單語音輸入 — Mac 選單列面板

  這個檔案由 voice-input-menubar.lua 用 hs.webview:html() 載入，不是從伺服器抓的。
  四個理由（合起來才完整）：
    1. 面板要顯示的幾乎都是 Mac 本地狀態（錄音中、經過秒數、本地錯誤），伺服器不知道
    2. web/index.html 會自己要麥克風並跑 AudioWorklet 錄音器——載進來會多一個錄音器
       和一個 WKWebView 的麥克風權限提示
    3. 「連不上 Spark」正是最需要面板的時候，如果面板就是 Spark 的頁面，那會是一片空白
    4. 開啟瞬間完成，離線也能用

  樣式沿用 web/index.html 的 Shadow VI，兩邊看起來要是同一個產品。
  字體由 Lua 端把 Anton 的 base64 塞進 @FONT@ —— :html() 的 origin 是 null，
  跨來源載字體會被 WKWebView 擋掉，所以只能內嵌。
-->
<title>超簡單語音輸入</title>
<style>
@font-face {
  font-family: 'Anton';
  src: url(@FONT@) format('truetype');
  font-display: swap;
}
:root {
  --ink: #000000;
  --fg: #ffffff;
  --steel: #595757;
  --dim: #999999;
  --line: #212121;
  --orange: #EA5504;
  --display: 'Anton', 'Arial Narrow', sans-serif;
  --body: 'Noto Sans TC', 'PingFang TC', system-ui, sans-serif;
}
* { box-sizing: border-box; -webkit-user-select: none; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--ink); color: var(--fg);
  font-family: var(--body); font-size: 18px; line-height: 1.6;
  display: flex; flex-direction: column;
}

/* 45° 性能斜紋，整個畫面只出現這一次（規範） */
.stripes {
  height: 4px; flex: none;
  background: repeating-linear-gradient(45deg, var(--orange) 0 6px, transparent 6px 12px);
  -webkit-mask-image: linear-gradient(90deg, #000 0%, #000 42%, transparent 88%);
}

.scroll { flex: 1; overflow-y: auto; padding: 0 16px 16px; }

.head { display: flex; align-items: center; gap: 10px; padding: 14px 0 16px; }
.head .kicker {
  margin-left: auto; font-family: var(--display);
  font-size: 15px; letter-spacing: .28em; color: var(--steel);
}
.head .mark { font-family: var(--display); font-size: 18px; letter-spacing: .2em; color: var(--fg); }
.head .user {
  -webkit-appearance: none; appearance: none;
  background: transparent; border: 1px solid var(--line); border-radius: 0;
  color: var(--fg); font-family: var(--body); font-size: 16px;
  padding: 2px 8px; cursor: pointer;
}
.head .user:hover, .head .user:focus { border-color: var(--steel); outline: none; }
.head .user option { background: var(--ink); color: var(--fg); }

.label {
  font-family: var(--display); font-size: 14px; letter-spacing: .24em;
  color: var(--steel); margin: 14px 0 6px;
}
.card { border: 1px solid var(--line); padding: 12px; }

/* ── 狀態 ── */
.readout { font-family: var(--display); font-size: 45px; line-height: 1; letter-spacing: .02em; }
.readout .unit { font-size: 18px; color: var(--steel); margin-left: 4px; letter-spacing: .1em; }
.state { font-size: 17px; color: var(--dim); margin-top: 4px; }
.state.live { color: var(--orange); }

/* ── 音量條 ──
   跟 web/index.html 和桌面小視窗共用同一條 80–16000 的對數軸，
   所以同一個數字在三個介面上會落在同一個位置。 */
.meter {
  position: relative; height: 10px; margin: 12px 0 6px;
  background: #151515; border: 1px solid var(--line); overflow: hidden;
}
.meter-fill { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--steel); }
.meter-fill.over { background: var(--orange); }
.meter-mark { position: absolute; top: -4px; bottom: -4px; width: 1px; background: var(--steel); left: 0; }
.meter-legend {
  position: relative; height: 14px;
  font-family: var(--display); font-size: 14px; letter-spacing: .2em; color: var(--steel);
}
.meter-legend .mk { position: absolute; top: 0; transform: translateX(-50%); white-space: nowrap; color: var(--dim); }
.caption { font-size: 16px; color: var(--dim); }
.caption.over { color: var(--orange); }

button {
  font-family: var(--body); font-size: 17px; color: var(--fg);
  background: transparent; border: 1px solid var(--line); border-radius: 0;
  padding: 5px 10px; cursor: pointer;
}
button:hover { border-color: var(--steel); }
button:disabled { color: var(--steel); cursor: default; }
button.primary { border-color: var(--orange); }
[hidden] { display: none !important; }

/* ── 按鈕 ── */
.btnrow { display: flex; gap: 6px; margin-top: 10px; }

/* ── 閘門統計 ── */
.kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 12px; font-size: 16px; }
.kv dt { font-family: var(--display); letter-spacing: .16em; color: var(--steel); }
.kv dd { margin: 0; color: var(--dim); }
.raw { font-size: 15px; color: var(--steel); word-break: break-all; white-space: pre-wrap; max-height: 90px; overflow: auto; }

/* ── 歷史 ── */
.row { display: flex; gap: 8px; padding: 6px 0; border-top: 1px solid var(--line); cursor: pointer; }
.row:hover { background: #0a0a0a; }
.row .t { font-family: var(--display); font-size: 15px; color: var(--steel); flex: none; padding-top: 2px; }
.row .src { flex: none; font-size: 15px; padding-top: 2px; }
.row .x { flex: 1; font-size: 17px; word-break: break-word; }

/* ── 設定 ── */
.opt { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
.opt .name { flex: 1; }
.opt .sub { font-size: 15px; color: var(--steel); }
.opt input[type=checkbox] { accent-color: var(--orange); width: 15px; height: 15px; }
/* ── 少用的東西收起來 ── */
.more > summary { cursor: pointer; list-style: none; margin-top: 18px; }
.more > summary::before { content: '▸ '; }
.more[open] > summary::before { content: '▾ '; }
.more > summary::-webkit-details-marker { display: none; }

/* ── 詞彙 TAG ──
   一個詞一顆 TAG，自動換行排滿。順序就是優先順序（左上最優先）。
   沒生效的是虛線灰色；點 TAG 本身＝移到最前面，右邊的 ✕＝刪除（5 秒內可復原）。 */
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; max-height: 320px; overflow-y: auto; }
.tag {
  display: inline-flex; align-items: center; border: 1px solid var(--steel);
  font-size: 17px; line-height: 1.5; max-width: 100%;
}
.tag .w { padding: 1px 4px 1px 8px; cursor: pointer; word-break: break-all; }
.tag .x { padding: 1px 8px; cursor: pointer; color: var(--dim); border-left: 1px solid var(--line); }
.tag .x:hover { color: var(--orange); }
.tag.off { border-style: dashed; border-color: var(--line); }
.tag.off .w { color: var(--steel); }
.tag.off .w:hover { color: var(--fg); }
.tags .cut { flex-basis: 100%; font-size: 15px; color: var(--orange); margin-top: 4px; }
.vempty { font-size: 16px; color: var(--steel); padding: 8px 0; }
.undo { display: flex; align-items: center; gap: 10px; margin-top: 8px; font-size: 16px; color: var(--dim); }

input[type=text] {
  background: #0a0a0a; border: 1px solid var(--line); color: var(--fg);
  font-family: var(--body); font-size: 17px; padding: 4px 6px; width: 100%;
  -webkit-user-select: text;
}

.foot {
  flex: none; display: flex; align-items: center; gap: 8px;
  padding: 8px 16px; border-top: 1px solid var(--line);
  font-family: var(--display); font-size: 14px; letter-spacing: .2em; color: var(--steel);
}
.foot .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--steel); }
.foot .dot.ok { background: var(--orange); }
.foot .who { margin-left: auto; letter-spacing: .1em; }
</style>

<div class="stripes"></div>
<div class="scroll">
  <div class="head">
    <span class="mark">SHADOW</span>
    <span class="kicker">VOICE INPUT · MAC</span>
    <!-- 我是誰：value 是完整 email，存進本機設定檔的 VOICE_USER，.sh 原樣放進 X-Voice-User -->
    <select id="user" class="user" aria-label="我是誰">
      <option value="livangvang@gmail.com">livangvang</option>
      <option value="leochao1212@gmail.com">leochao1212</option>
    </select>
  </div>

  <div class="label">STATUS</div>
  <div class="card">
    <div class="readout"><span id="big">—</span><span class="unit" id="unit"></span></div>
    <div class="state" id="state">待命</div>

    <div class="meter">
      <div class="meter-fill" id="fill"></div>
      <div class="meter-mark" id="mark"></div>
    </div>
    <div class="meter-legend"><span class="mk" id="mklabel"></span></div>
    <div class="caption" id="caption">還沒有量測值。口述一次之後會顯示。</div>
    <!-- 靈敏度（這台 Mac 的門檻）：放在音量條正下方，調它時要對照的就是上面那條。
         留白＝跟著 Spark 的全域值；placeholder 顯示目前實際用的數字。 -->
    <div class="opt">
      <div class="name">靈敏度</div>
      <input type="text" id="localthold" spellcheck="false" style="width:96px;text-align:right">
    </div>
  </div>

  <div class="label">VOCAB</div>
  <div class="card">
    <div class="opt">
      <div class="name">常用詞彙<div class="sub" id="vocabsub" style="white-space:pre-line">讀取中…</div></div>
    </div>
    <input type="text" id="vocabword" spellcheck="false" placeholder="要記住的詞，例如人名">
    <div class="btnrow">
      <button id="vocabadd">加入詞彙</button>
    </div>
    <div class="raw" id="vocabmsg"></div>
    <!-- 刪除先藏起來 VOCAB_UNDO_SECONDS 秒，時間到才真的送出；這段時間可以復原 -->
    <div class="undo" id="undobox" hidden>
      <span id="undotext"></span><button id="undobtn">復原</button>
    </div>
    <!-- 全部的詞，照優先順序。點 TAG＝移到最前面，✕＝刪除 -->
    <div class="tags" id="vlist"><div class="vempty">讀取中…</div></div>
    <div class="opt">
      <div class="name" style="color:var(--steel);font-size: 16px">
        詞要存幾個都可以，但 whisper 一次只吃得下前面幾十個。
        實線的有生效，虛線的存著但沒生效——點一下 TAG 就移到最前面，它就生效了。
        這是你自己的詞彙表，改完下一句就生效。
      </div>
    </div>
  </div>

  <details class="more">
    <summary class="label">MORE · 閘門數據 / 歷史 / 其他設定</summary>
  <div class="label">GATE</div>
  <div class="card">
    <dl class="kv" id="kv"></dl>
    <div class="raw" id="raw"></div>
  </div>

  <div class="label">LOG</div>
  <div class="card" id="log"><div class="result empty">還沒有記錄</div></div>

  <div class="label">SETTINGS</div>
  <div class="card">
    <div class="opt">
      <div class="name">每次輸入後補一個空白<div class="sub">TRAILING_SPACE</div></div>
      <input type="checkbox" id="trailing">
    </div>
    <div class="opt">
      <div class="name">辨識伺服器<div class="sub">改完立即生效</div></div>
    </div>
    <input type="text" id="server" spellcheck="false">
    <div class="btnrow"><button id="openweb">開啟網頁版</button><button id="update">檢查更新</button></div>
  </div>
  </details>
</div>

<div class="foot">
  <span class="dot" id="dot"></span><span id="health">檢查中…</span>
  <span class="who" id="who"></span>
</div>

<script>
// Lua → 頁面：VI.push(state)。頁面只做渲染，不自己抓資料——
// 所有的取得邏輯都在 Lua，這裡拿到什麼畫什麼。
// 頁面 → Lua：window.webkit.messageHandlers.vi.postMessage({action:…})
const $ = id => document.getElementById(id);
const send = o => { try { window.webkit.messageHandlers.vi.postMessage(o); } catch (e) {} };

const AXIS_MIN = 80, AXIS_MAX = 16000;
const axisPos = v => {
  if (!v || v <= 0) return 0;
  const lo = Math.log(AXIS_MIN), hi = Math.log(AXIS_MAX);
  const x = (Math.log(Math.max(AXIS_MIN, Math.min(AXIS_MAX, v))) - lo) / (hi - lo);
  return Math.max(0, Math.min(1, x));
};
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));


// ── 學起來：比對「辨識原文」和「使用者改好後選起來的文字」──
// 最長共同前綴 + 最長共同後綴，中間那段就是「錯的 → 對的」，只提一條。
// 用 Array.from 按字（code point）切，emoji 之類的代理對才不會被切成兩半。
// 回傳 {bad, good} 或 {error}。上限跟伺服器的 CORRECTION_MAX_LEN 同一個數字。
const LEARN_MAX = 50, LEARN_MIN_BAD = 2, LEARN_SECONDS = 5;
function learnDiff(original, selected) {
  const a = Array.from(String(original || '').trim());
  const b = Array.from(String(selected || '').trim());
  if (!b.length) return {error: '沒有讀到選取的文字'};
  if (a.join('') === b.join('')) return {error: '選起來的字跟辨識原文一樣，沒有可學的差異'};

  let p = 0;
  while (p < a.length && p < b.length && a[p] === b[p]) p++;
  let s = 0;
  while (s < a.length - p && s < b.length - p && a[a.length - 1 - s] === b[b.length - 1 - s]) s++;

  // 差異太誇張 = 多半是選錯了範圍：頭尾完全對不上（短句例外，整句都錯是有可能的），
  // 或是改出來的那段比整句原文還長。
  if ((p + s === 0 && a.length > 4) || b.length - p - s > a.length)
    return {error: '選起來的字跟辨識原文差太多，沒有可學的差異（要選改好的那一整句）'};

  const W = c => c !== undefined && /[A-Za-z0-9_]/.test(c);
  // 英文要擴到整個單字：校正表對純 ASCII 的錯的寫法要求單字邊界，
  // 「Clade → Claude」只比出中間的「u」的話，這條規則永遠對不上。
  const words = () => {
    while (p > 0 && W(a[p - 1]) && (W(a[p]) || W(b[p]))) p--;
    while (s > 0 && W(a[a.length - s]) && (W(a[a.length - s - 1]) || W(b[b.length - s - 1]))) s--;
  };
  const mid = () => [a.slice(p, a.length - s).join(''), b.slice(p, b.length - s).join('')];
  // 還要往旁邊多帶字的情況（先右後左）：
  //   - 錯的或對的是空的（只加字／刪字）：校正表不收空字串
  //   - 頭尾是空白：伺服器會 strip 掉，存進去的就不是比出來的那條
  //   - 非 ASCII 又太短：「少 → 紹」會把「多少」改壞，中文沒有詞邊界
  const need = (bad, good) => !bad || !good || bad !== bad.trim() || good !== good.trim()
    || (!/^[\x00-\x7f]*$/.test(bad) && Array.from(bad).length < LEARN_MIN_BAD);
  words();
  let [bad, good] = mid();
  while (need(bad, good)) {
    if (s > 0) s--; else if (p > 0) p--; else break;
    words();
    [bad, good] = mid();
  }

  if (need(bad, good) || bad === good) return {error: '沒有可學的差異'};
  if (/[\t\r\n]/.test(bad + good)) return {error: '差異裡有換行，學不了（選一句就好）'};
  if (Array.from(bad).length > LEARN_MAX || Array.from(good).length > LEARN_MAX)
    return {error: '差異超過 ' + LEARN_MAX + ' 個字，太長了學不了'};
  return {bad, good};
}

// ── 詞彙 TAG ──
// Lua 錄音時每 0.1 秒 push 一次，TAG 只在內容變了才重畫——不然滑鼠 hover 會一直被洗掉。
// 空的 Lua table 會被 hs.json 編成 {}，所以一律過 arr()。
const arr = v => Array.isArray(v) ? v : [];
let vocabUsed = null, vocabDropped = [], vocabDrawn = '';
// 刪除：先從畫面上拿掉，VOCAB_UNDO_SECONDS 秒後才真的送出。期間按「復原」就當沒發生。
// 用延遲而不是「刪了再加回去」：加回去會排到最前面，原本的優先順序就亂了。
const VOCAB_UNDO_SECONDS = 5;
let pendingDelete = null;    // {word, timer}

function renderVocabList(force) {
  if (vocabUsed === null) return;
  const hide = pendingDelete ? pendingDelete.word : null;
  const used = vocabUsed.filter(w => w !== hide), dropped = vocabDropped.filter(w => w !== hide);
  const key = JSON.stringify([used, dropped]);
  if (!force && key === vocabDrawn) return;
  vocabDrawn = key;
  if (!used.length && !dropped.length) {
    $('vlist').innerHTML = '<div class="vempty">還沒有詞</div>';
    return;
  }
  const tag = (w, off) =>
    '<span class="tag' + (off ? ' off' : '') + '" data-w="' + esc(w) + '">' +
      '<span class="w" title="' + (off ? '沒生效 · 點一下移到最前面' : '點一下移到最前面') + '">' + esc(w) + '</span>' +
      '<span class="x" title="刪除">✕</span></span>';
  $('vlist').innerHTML = used.map(w => tag(w, false)).join('') +
    (dropped.length ? '<div class="cut">以下 ' + dropped.length + ' 個沒生效</div>' : '') +
    dropped.map(w => tag(w, true)).join('');
}

function commitDelete() {
  if (!pendingDelete) return;
  const {word, timer} = pendingDelete;
  clearTimeout(timer);
  pendingDelete = null;
  $('undobox').hidden = true;
  send({action: 'removeVocab', word});
}

$('vlist').onclick = e => {
  const tagEl = e.target.closest('.tag');
  if (!tagEl) return;
  const word = tagEl.dataset.w;
  if (e.target.closest('.x')) {
    commitDelete();                         // 上一個還在等的先送出，一次只留一個可以復原
    pendingDelete = {word, timer: setTimeout(commitDelete, VOCAB_UNDO_SECONDS * 1000)};
    $('undotext').textContent = '已刪除「' + word + '」';
    $('undobox').hidden = false;
    renderVocabList(true);
  } else if (e.target.closest('.w')) {
    if (vocabUsed[0] === word) return;      // 已經是第一個
    $('vocabmsg').textContent = '移動中…';
    send({action: 'vocabTop', word});
  }
};
$('undobtn').onclick = () => {
  if (!pendingDelete) return;
  clearTimeout(pendingDelete.timer);
  pendingDelete = null;
  $('undobox').hidden = true;
  renderVocabList(true);
};

window.VI = {
  push(s) {
    // ── 狀態 ──
    const ph = s.phase || 'idle';
    if (ph === 'recording') {
      $('big').textContent = (s.elapsed || 0).toFixed(1);
      $('unit').textContent = 'S';
      $('state').textContent = '收音中';
      $('state').className = 'state live';
    } else if (ph === 'transcribing') {
      $('big').textContent = '···';
      $('unit').textContent = '';
      $('state').textContent = '辨識中';
      $('state').className = 'state';
    } else {
      const sec = s.last && s.last.seconds;
      $('big').textContent = sec ? sec.toFixed(2) : '—';
      $('unit').textContent = sec ? 'S' : '';
      $('state').textContent = '待命';
      $('state').className = 'state';
    }

    // ── 音量條：門檻刻度 + 上次量到的 p95 ──
    // 刻意標成「上次量到」而不是即時。Mac 上 sox 獨佔麥克風、不回報音量，
    // 桌面版那條即時儀表是 voice-input-autostop 每 100ms 餵的，這裡沒有對應的東西。
    // 這台有自己的門檻就畫這台的。畫全域值會讓刻度跟實際判斷不一致，
    // 使用者會看到「明明高於門檻卻被擋下」。
    const thold = parseInt(s.config.SPEECH_ABS_THOLD, 10) || s.threshold;
    if (thold) {
      $('mark').style.left = (axisPos(thold) * 100) + '%';
      $('mklabel').style.left = (axisPos(thold) * 100) + '%';
      $('mklabel').textContent = (s.config.SPEECH_ABS_THOLD ? '我的門檻 ' : '門檻 ') + thold;
    }
    const g = s.last && s.last.gate;
    if (g && g.p95 != null) {
      const over = thold ? g.p95 >= thold : false;
      $('fill').style.width = (axisPos(g.p95) * 100) + '%';
      $('fill').className = 'meter-fill' + (over ? ' over' : '');
      $('caption').textContent = '上次量到 ' + g.p95 + (over ? ' · 高於門檻' : ' · 低於門檻，會被擋下');
      $('caption').className = 'caption' + (over ? ' over' : '');
    }

    // ── 閘門統計 ──
    // 解析失敗時顯示原始字串。那行字是 speech-gate.py 印給人看的 stderr，
    // 從來不是 API，格式改了要退化成「還看得懂」而不是空白。
    if (g) {
      if (g.p95 != null) {
        $('kv').innerHTML =
          '<dt>P95</dt><dd>' + g.p95 + (g.needP95 ? ' （需 ≥ ' + g.needP95 + '）' : '') + '</dd>' +
          '<dt>FLOOR</dt><dd>' + (g.floor ?? '—') + '</dd>' +
          '<dt>RATIO</dt><dd>' + (g.ratio ?? '—') + (g.needRatio ? ' （需 ≥ ' + g.needRatio + '）' : '') + '</dd>';
        $('raw').textContent = '';
      } else {
        $('kv').innerHTML = '';
        $('raw').textContent = g.raw || '';
      }
    }

    // ── 歷史 ──
    if (s.history) {
      $('log').innerHTML = s.history.length ? s.history.map(it => {
        const src = String(it.src || '');
        const badge = src.startsWith('mac') ? '💻' : (src.startsWith('web') ? '🌐' : '　');
        return '<div class="row" data-t="' + esc(it.text) + '">' +
               '<span class="t">' + esc((it.ts || '').slice(11, 16)) + '</span>' +
               '<span class="src">' + badge + '</span>' +
               '<span class="x">' + esc(it.text) + '</span></div>';
      }).join('') : '<div class="result empty">還沒有記錄</div>';
      [...document.querySelectorAll('.row')].forEach(el =>
        el.onclick = () => send({action: 'copy', text: el.dataset.t}));
    }

    // ── 連線與設定 ──
    if (s.health !== undefined) {
      $('dot').className = 'dot' + (s.health ? ' ok' : '');
      $('health').textContent = s.health ? '已連線 SPARK' : (s.healthError || '連不上 SPARK');
      $('who').textContent = s.who && s.who !== 'unknown' ? s.who : '';
    }
    // ── 詞彙表 ──
    if (s.vocab) {
      $('vocabsub').textContent = s.vocab.summary || '';
      $('vocabmsg').textContent = s.vocab.msg || '';
      if (s.vocab.used !== undefined) {
        vocabUsed = arr(s.vocab.used); vocabDropped = arr(s.vocab.dropped);
        renderVocabList();
      }
    }
    // 我是誰：Lua 已經把清單外的值退回預設了，這裡照畫
    if (s.user && document.activeElement !== $('user')) $('user').value = s.user;
    if (s.config) {
      if (document.activeElement !== $('server')) $('server').value = s.config.SERVER || '';
      $('trailing').checked = s.config.TRAILING_SPACE === '1';
      if (document.activeElement !== $('localthold'))
        $('localthold').value = s.config.SPEECH_ABS_THOLD || '';
      $('localthold').placeholder = s.threshold ? String(s.threshold) : '';
    }
  }
};

$('openweb').onclick = () => send({action: 'openWeb'});
$('update').onclick  = () => send({action: 'checkUpdate'});
// 加詞：按鈕或直接按 Enter 都可以。送出後清空輸入框，免得連按兩次加成兩筆。
const addVocab = () => {
  const w = $('vocabword').value.trim();
  if (!w) return;
  $('vocabword').value = '';
  $('vocabmsg').textContent = '加入中…';
  send({action: 'addVocab', word: w});
};
$('vocabadd').onclick = addVocab;
$('vocabword').onkeydown = e => { if (e.key === 'Enter') addVocab(); };
$('trailing').onchange = e => send({action: 'setConfig', key: 'TRAILING_SPACE', value: e.target.checked ? '1' : '0'});
$('user').onchange     = e => send({action: 'setUser', user: e.target.value});
$('server').onchange   = e => send({action: 'setConfig', key: 'SERVER', value: e.target.value.trim()});
// 留白＝清掉這台的覆蓋值，回頭跟著全域值。範圍外或不是純數字的值不寫入也不夾到
// 邊界——打錯字應該回到「還能用」的狀態，而不是靜靜套上一個你沒要求的數字。
$('localthold').onchange = e => {
  const raw = e.target.value.trim();
  if (raw === '') return send({action: 'setConfig', key: 'SPEECH_ABS_THOLD', value: ''});
  const v = /^\d+$/.test(raw) ? parseInt(raw, 10) : NaN;
  if (!(v >= AXIS_MIN && v <= AXIS_MAX)) {
    e.target.value = '';
    $('localthold').placeholder = AXIS_MIN + '–' + AXIS_MAX;
    return;
  }
  send({action: 'setConfig', key: 'SPEECH_ABS_THOLD', value: String(v)});
};
</script>
